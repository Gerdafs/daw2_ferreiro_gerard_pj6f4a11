<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New order - Order Management App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="box">
            <h1>Create a new order</h1>
            <form id="orderForm">
                <div class="field">
                    <label for="orderId">Order ID</label>
                    <input type="text" id="orderId" name="orderId" required>
                </div>
                <div class="field">
                    <label for="fullName">Customer full name</label>
                    <input type="text" id="fullName" name="fullName" required>
                </div>
                <div class="field">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" rows="3" required></textarea>
                </div>
                <div class="field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="field">
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <h2>Products</h2>
                <p>Tick the products the customer wants to buy and enter the quantity.</p>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Buy</th>
                                <th>Product</th>
                                <th>Price (excl. VAT)</th>
                                <th>Quantity</th>
                            </tr>
                        </thead>
                        <tbody id="productList"></tbody>
                    </table>
                </div>

                <p id="error" class="message error"></p>
                <p id="result" class="message result"></p>

                <div class="buttons">
                    <a class="button" href="menu.html">Back to operations menu</a>
                    <a class="button" href="index.html">Back to start</a>
                    <button type="submit" class="primary">Send order</button>
                </div>
            </form>
        </div>
    </main>
    <script src="newOrder.js"></script>
</body>
</html>
