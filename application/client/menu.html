<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operations menu - Gerard's Management App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="box">
            <h1>Operations menu</h1>
            <div class="field">
                <label for="operation">Select an operation</label>
                <select id="operation">
                    <option value="newOrder.html" selected>Create a new order</option>
                    <option value="viewOrders.html">View orders</option>
                </select>
            </div>
            <div class="buttons">
                <a class="button" href="index.html">Back to start</a>
                <button type="button" id="goButton" class="primary">Go</button>
            </div>
        </div>
    </main>
    <script src="menu.js"></script>
</body>
</html>
