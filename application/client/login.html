<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Gerard's Order Management App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="box">
            <h1>Log in</h1>
            <form id="loginForm">
                <div class="field">
                    <label for="user">Username</label>
                    <input type="text" id="user" name="user">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password">
                </div>
                <p id="message" class="message error"></p>
                <div class="buttons">
                    <a class="button" href="index.html">Back to start</a>
                    <button type="submit" class="primary">Go to operations menu</button>
                </div>
            </form>
        </div>
    </main>
    <script src="login.js"></script>
</body>
</html>
